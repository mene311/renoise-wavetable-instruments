name: ingest donations

on:
  push:
    paths:
      - "donations/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the hashing needs
        run: pip install numpy soundfile
      - name: Say what would happen
        run: python3 tools/ingest_donations.py --dry-run
      - name: File them
        run: python3 tools/ingest_donations.py
      - name: Commit the result
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "nothing to file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "File the donations that were new"
          git push
